name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy-admin-panel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to S3/CloudFront
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint step removed for now — 5 pre-existing react-refresh/only-export-components
      # errors in context files block it. Re-add once those are fixed.

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2 using SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "JashanZ Admin deployment - $GITHUB_SHA" \
            --parameters 'commands=[
              "set -e",
              "runuser -u jashanz -- bash -lc '\''cd /var/www/jashanz-admin/JashanZ-admin-panel-FromUtkarsh && git fetch origin main && git checkout main && git reset --hard origin/main && npx -y npm@11.6.1 ci && VITE_API_URL=https://api.jashanz.com/api/v1 npx -y npm@11.6.1 run build'\''",
              "test -f /var/www/jashanz-admin/JashanZ-admin-panel-FromUtkarsh/dist/index.html",
              "curl -fsS https://admin.jashanz.com/ > /dev/null"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          echo "Deployment completed successfully."

      - name: Verify Admin Portal
        run: |
          set -euo pipefail

          echo "Checking https://admin.jashanz.com"
          curl -fsSI https://admin.jashanz.com

          echo "Admin deployment successful."
